services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teamos_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamos_prod_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-teamos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-teamos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamos_net

  redis:
    image: redis:7-alpine
    container_name: teamos_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - teamos_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: teamos_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-teamos_prod_secure_pwd}@postgres:5432/${POSTGRES_DB:-teamos_db}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_super_secure_jwt_access_secret_256_bit_entropy}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_super_secure_jwt_refresh_secret_256_bit_entropy}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-github_production_webhook_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - teamos_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    container_name: teamos_prod_web
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - teamos_net

volumes:
  postgres_data:
    name: teamos_prod_postgres_data
    driver: local
  redis_data:
    name: teamos_prod_redis_data
    driver: local

networks:
  teamos_net:
    name: teamos_network
    driver: bridge
